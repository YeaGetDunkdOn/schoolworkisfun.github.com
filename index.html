<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- This changes what the browser tab says for teachers -->
    <title>📘 School Work Is Fun 📘</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #4da6ff;
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px #0052cc;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            padding: 20px;
        }
        .game-card {
            background: #1e1e1e;
            border: 3px solid #0052cc;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .game-card:hover {
            transform: scale(1.05);
            background-color: #0052cc;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sneaky study theme header -->
        <h1>📘 School Work Is Fun 📘</h1>
        <p>Select a learning capsule module below to begin your independent study session!</p>
        
        <div class="grid">
            <!-- Hidden game pathways disguised as school lessons -->
            <a class="game-card" href="slope.html">📐 Math Module: Slope Velocity</a>
            <a class="game-card" href="retro-bowl.html">🏈 Physics Module: Retro Trajectory</a>
        </div>
    </div>

</body>
</html>
